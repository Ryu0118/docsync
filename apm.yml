# APM (Microsoft Agent Package Manager) producer manifest.
# Lets consumers install docsync's skill with a single command:
#   apm install Ryu0118/docsync
# Skill sources live in skills/ (single source of truth, shared with the
# Claude Code plugin); .apm/skills/ contains symlinks to them.
# version tracks the CLI release version; publish-release.yml bumps it automatically.
name: docsync
version: 0.3.1
description: docsync configuration and recovery guide for AI agents.
author: Ryu0118
license: MIT
dependencies:
  apm: []
  mcp: []
includes:
  - .apm/skills/docsync/
scripts: {}
